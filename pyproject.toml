[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "papertoanything"
version = "0.1.0"
description = "See a PyTorch model and its training in the Paper To Anything Lab. Nothing is uploaded."
readme = "PYPI.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Dhruva P Gowda" }]
keywords = ["pytorch", "visualization", "training", "transformer", "interpretability", "debugging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.0", "numpy"]
hf = ["torch>=2.0", "numpy", "transformers"]
test = ["pytest"]

[project.urls]
Homepage = "https://papertoanything.com"
Repository = "https://github.com/PaperToAnything/papertoanything"
Documentation = "https://papertoanything.com/lab/import/"
Lab = "https://lab.papertoanything.com"
"Bug Tracker" = "https://github.com/PaperToAnything/papertoanything/issues"

[project.scripts]
ptoa = "papertoanything.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
papertoanything = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
