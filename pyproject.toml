[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "papertoanything"
version = "0.0.1"
description = "See a PyTorch model and its training live in a browser tab. Local only: nothing is uploaded."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Dhruva P Gowda" }]
keywords = ["pytorch", "visualization", "training", "transformer", "interpretability", "debugging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.0", "numpy"]
test = ["pytest"]

[project.urls]
Homepage = "https://papertoanything.com"
Lab = "https://lab.papertoanything.com"

[project.scripts]
pta = "papertoanything.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
papertoanything = ["py.typed", "_lab/*", "_lab/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
